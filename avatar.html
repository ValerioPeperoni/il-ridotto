<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<title>Camerino · il tuo personaggio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#fff;--pri:#ffcf4a;--acc:#7b5cff;--bg1:#2a1f4f;--bg2:#120c24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#4a3a8a,#1b1430 60%,#0c0818);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none}
.hide{display:none!important}
#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
#top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#name{font:inherit;font-size:20px;font-weight:600;color:#2a1f4f;background:#fff;border:none;border-radius:999px;padding:8px 16px;width:200px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#panel{position:fixed;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);width:min(340px,44vw);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:12px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:500;font-size:15px}
.tab.sel{background:var(--pri);color:#2a1f4f;font-weight:700}
#opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:50vh;overflow:auto;padding:2px}
.opt{padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.14);font-size:15px;font-weight:500;min-height:46px;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .1s}
.opt:active{transform:translateY(2px)}
.opt.sel{background:#fff;color:#2a1f4f;font-weight:700;box-shadow:0 3px 0 var(--pri),0 0 0 3px var(--pri)}
.sw{height:46px;border-radius:14px}
#anims{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.an{padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#right{position:fixed;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.big{padding:14px 22px;border-radius:18px;font-size:20px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.big.y{background:var(--pri);color:#2a1f4f}.big.v{background:var(--acc)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
#load{position:fixed;inset:0;display:grid;place-items:center;font-size:22px;font-weight:600}
#load i{display:block;width:240px;height:10px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden}
#load b{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#fff;color:#2a1f4f;font-weight:700;padding:8px 18px;border-radius:999px;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
@media (max-width:700px){#panel{left:8px;right:8px;width:auto;top:auto;bottom:max(70px,calc(env(safe-area-inset-bottom) + 64px));transform:none}#opts{max-height:24vh;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}#right{top:max(64px,calc(env(safe-area-inset-top) + 58px));transform:none;flex-direction:row;right:8px}.big{padding:8px 14px;font-size:16px}#top h1{display:none}#anims{gap:5px;top:max(112px,calc(env(safe-area-inset-top) + 106px));bottom:auto;left:8px;right:8px;transform:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}.an{padding:6px 10px;font-size:14px;white-space:nowrap;flex:none}#panel{bottom:max(10px,env(safe-area-inset-bottom))}#opts{max-height:22vh}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="load"><div>Apro il camerino…<i><b id="bar"></b></i></div></div>
<div id="ui" class="hide">
  <div id="top"><h1>Il tuo personaggio</h1><input id="name" maxlength="14" placeholder="Nome"></div>
  <div id="panel"><div id="tabs"></div><div id="opts"></div></div>
  <div id="right"><button class="big v" id="rnd">🎲 A caso</button><button class="big y" id="save">✓ Salva</button><a class="big v" id="back" href="./" style="text-decoration:none;text-align:center">← Giochi</a></div>
  <div id="anims"></div>
</div>
<div id="toast"></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}</script>
<script type="module" src="avatar/camerino.js?v=202611230126"></script>
</body>
</html>
