<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Il Ridotto · il tuo posto</title>

<style>
/* Layout: una colonna a tutto schermo per il telefono; carta e ottone come il tavolo */
:root {
  --paper: #efe3c6; --paper-dark: #d8c7a0; --ink: #2a1a10; --gold: #d6b062; --wine: #7c1d22; --night: #0b0705; --green: #3d6b3a; --felt: #0d3a28;
  --line: rgba(214, 176, 98, .4); --display: "IM Fell English SC", Georgia, serif; --body: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--night); }
body { font-family: var(--body); color: var(--paper); font-size: 18px; line-height: 1.3; font-variant-numeric: lining-nums; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { min-height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: #120b07; position: sticky; top: 0; z-index: 3; }
.top h1 { margin: 0; font: 400 22px/1 var(--display); color: var(--gold); letter-spacing: .06em; }
.top .r { font: 600 15px var(--body); color: rgba(239,227,198,.75); text-align: right; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c66; margin-right: 6px; } .dot.ok { background: #7fc77a; }
main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); }
h2 { margin: 0; font: 400 26px/1.1 var(--display); color: var(--gold); letter-spacing: .04em; text-wrap: balance; }
h3 { margin: 0; font: 400 12px var(--display); letter-spacing: .16em; color: var(--gold); }
p { margin: 0; } .muted { color: rgba(239,227,198,.72); font-weight: 500; } .it { font-style: italic; font-weight: 600; }
.field { background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font: 700 22px var(--body); width: 100%; -webkit-user-select: text; user-select: text; }
.btn { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: 700 19px var(--body); min-height: 48px; }
.btn:active { transform: scale(.97); } .btn:disabled { opacity: .3; }
.btn.gold { background: radial-gradient(ellipse at 50% 30%, #e9c983, var(--gold) 60%, #a9843d); color: var(--ink); border-color: var(--gold); }
.btn.paper { background: radial-gradient(ellipse at 50% 30%, #f6ecd2, var(--paper) 55%, var(--paper-dark)); color: var(--ink); border-color: var(--paper-dark); }
.btn.red { background: radial-gradient(ellipse at 50% 30%, #a8343a, var(--wine) 60%, #4d1014); border-color: #b9444a; }
.btn.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn.big { font: 400 26px var(--display); letter-spacing: .04em; min-height: 76px; }
.btn.big small { display: block; font: italic 600 15px var(--body); letter-spacing: 0; opacity: .8; }
.btn.hint { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(214,176,98,.6); }
.row { display: flex; gap: 8px; flex-wrap: wrap; } .row > * { flex: 1 1 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.panel { background: rgba(255,255,255,.04); border: 1px solid rgba(214,176,98,.22); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
/* editor */
#stage { height: 36vh; min-height: 210px; border-radius: 8px; background: radial-gradient(ellipse at 50% 35%, #2a1a12, #0b0705 75%); border: 1px solid var(--line); position: relative; overflow: hidden; }
#stage canvas { width: 100%; height: 100%; display: block; }
#stage .who { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font: 400 20px var(--display); letter-spacing: .08em; text-shadow: 0 2px 6px #000; pointer-events: none; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font: 700 17px var(--body); }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 7px; }
.opts button { background: rgba(255,255,255,.06); border: 1px solid rgba(214,176,98,.3); border-radius: 8px; padding: 9px 6px; font: 700 16px/1.1 var(--body); min-height: 46px; }
.opts button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: var(--c); }
.sw button[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
/* gioco */
.me { display: flex; justify-content: space-between; align-items: baseline; }
.me .chips { font: 700 30px/1 var(--body); color: var(--gold); } .me .chips small { font: 400 12px var(--display); letter-spacing: .14em; color: rgba(239,227,198,.7); margin-left: 6px; }
.status { font: italic 600 18px/1.25 var(--body); text-align: center; min-height: 23px; text-wrap: balance; }
.felt { background: radial-gradient(ellipse at 50% 30%, #145a3c, var(--felt) 70%); border: 1px solid rgba(214,176,98,.45); border-radius: 10px; padding: 10px 12px; display: grid; gap: 10px; }
.line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.line .lbl { font: 400 11px var(--display); letter-spacing: .14em; color: rgba(239,227,198,.8); width: 54px; flex: none; }
.cards { display: flex; }
.cd { width: 40px; height: 56px; border-radius: 5px; background: #f6edd6; color: #1d140e; margin-right: -12px; box-shadow: 0 2px 5px rgba(0,0,0,.5); border: 1px solid #cdbf9c; display: grid; place-items: center; font: 700 21px/1 var(--body); text-align: center; position: relative; }
.cd small { display: block; font-size: 17px; line-height: .9; } .cd.r { color: #a3201c; }
.cd.back { background: repeating-linear-gradient(45deg, #6c1519 0 5px, #7f1e22 5px 10px); border: 2px solid #f6edd6; }
.cards .cd:last-child { margin-right: 0; }
.tot { background: var(--paper); color: var(--ink); font: 700 18px var(--body); padding: 1px 10px; border-radius: 4px; }
.tot.bust { background: var(--wine); color: var(--paper); } .tot.win { background: var(--green); color: #f2ecd8; } .tot.gold { background: var(--gold); }
.hand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 6px; border-radius: 8px; } .hand.active { background: rgba(214,176,98,.18); box-shadow: inset 0 0 0 1px var(--gold); }
.hand .st { font: 600 15px var(--body); color: rgba(239,227,198,.85); }
.timer { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; } .timer i { display: block; height: 100%; background: var(--gold); transform-origin: left; animation: tm linear forwards; }
@keyframes tm { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.betnum { text-align: center; font: 700 54px/1 var(--body); color: var(--paper); } .betnum small { display: block; font: 400 12px var(--display); letter-spacing: .16em; color: rgba(239,227,198,.7); margin-bottom: 2px; }
.chiprow { display: flex; justify-content: center; gap: 12px; }
.chip { width: 64px; height: 64px; border-radius: 50%; font: 700 19px var(--body); color: #fff; position: relative;
  background: conic-gradient(var(--c) 0 9%, #f4ead0 9% 14%, var(--c) 14% 34%, #f4ead0 34% 39%, var(--c) 39% 59%, #f4ead0 59% 64%, var(--c) 64% 84%, #f4ead0 84% 89%, var(--c) 89%); box-shadow: 0 5px 0 rgba(0,0,0,.5); }
.chip::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--c); border: 2px dashed rgba(244,234,208,.7); } .chip span { position: relative; }
.chip:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.5); } .chip:disabled { opacity: .3; }
.seg { display: flex; gap: 6px; } .seg button { flex: 1; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px; font: 700 17px var(--body); min-height: 42px; } .seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.phr { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .phr::-webkit-scrollbar { display: none; }
.phr button { flex: none; background: rgba(239,227,198,.92); color: var(--ink); border-radius: 14px; padding: 7px 12px; font: italic 700 16px var(--body); }
.pact { background: radial-gradient(ellipse at 50% 20%, #7a0f0f, #1a0404 80%); border: 1px solid #ff5a3a; border-radius: 10px; padding: 16px 14px; display: grid; gap: 12px; text-align: center; box-shadow: 0 0 30px rgba(255,60,30,.35); }
.pact h2 { color: #ffd23f; }
.rank { display: grid; gap: 2px; } .rank div { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 6px 4px; border-bottom: 1px solid rgba(214,176,98,.2); font: 700 20px var(--body); } .rank div.me { color: var(--gold); } .rank b { color: var(--gold); }
.handrow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; } .cdb { background: none; padding: 0; transition: transform .12s; } .cdb .cd { width: 58px; height: 82px; font-size: 28px; margin: 0; } .cdb .cd small { font-size: 22px; } .cdb.sel { transform: translateY(-12px); } .cdb.sel .cd { box-shadow: 0 0 0 3px var(--gold), 0 6px 12px rgba(0,0,0,.6); } .cdb:disabled { opacity: .85; }
.spacer { flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; } .tags span { font: 400 11px var(--display); letter-spacing: .1em; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--gold); }
</style>
